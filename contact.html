<!DOCTYPE html>

<html>

<head>
    <meta name="viewport" content="with=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Raleway:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--CSS -->
    <!-- <link rel="stylesheet" href="style.css"> -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!--aos-->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <title>AMS | HOME</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
        }


        .header {
            min-height: 100vh;
            width: 100%;
            background-image: linear-gradient(rgba(44, 28, 28, 0.217), rgb(0, 0, 0)), url(images/redbanner.jpg);
            background-position: center;
            background-size: cover;
            position: relative;
        }

        /* HEADER CONTENT */
        .row-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5% 10%;

        }

        .head-col {
            flex-basis: 50%;
            text-align: center;
        }


        nav {
            display: flex;
            padding: 2% 6%;
            justify-content: space-between;
            align-items: center;
        }

        nav img {
            width: 60px;
            border-radius: 10px;
        }

        .nav-links {
            flex: 1;
            text-align: right;
        }

        .nav-links ul li {
            list-style: none;
            display: inline-block;
            padding: 8px 12px;
            position: relative;
        }

        .nav-links ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
        }

        .nav-links ul li::after {
            content: '';
            width: 0%;
            height: 2px;
            background: #f44336;
            display: block;
            margin: auto;
            transition: 0.5s;
        }

        .nav-links ul li:hover::after {
            width: 100%;
        }

        .active {
            background: #f44336;
            padding: 10px 10px;
            border-radius: 5px;
        }

        nav .fa {
            display: none;
        }

        @media(max-width: 1400px) {

            .header {
                min-height: 100vh;
            }

            .row-head {
                flex-direction: column;
                text-align: center;
            }


            nav img {
                width: 50px;
            }


            .nav-links ul li {
                display: block;
            }

            .nav-links {
                position: fixed;
                background: #6f0505;
                height: 100vh;
                width: 200px;
                top: 0;
                right: -200px;
                text-align: left;
                z-index: 1000;
                transition: 0.5s;
                padding-top: 20px;
            }


            nav .fa {
                display: block;
                color: #fff;
                margin: 10px;
                font-size: 22px;
                cursor: pointer;
            }

            .nav-links ul {
                padding: 30px;
            }

            .nav-links ul li:hover::after {
                display: none;
            }
        }

        
        /* contact */

        .contact-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding-bottom: 150px;
        }

        .contact-left {
            display: flex;
            flex-direction: column;
            align-items: start;
            gap: 20px;
        }

        .contact-left-title h2 {
            font-weight: 600px;
            color: white;
            font-size: 40px;
            margin-bottom: 5px;
        }

        .contact-left-title hr {
            border: none;
            width: 120px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .contact-inputs {
            width: 400px;
            height: 50px;
            border: none;
            outline: none;
            padding-left: 25px;
            font-weight: 500;
            color: #000;
            border-radius: 50px;
        }

        .contact-left textarea {
            height: 140px;
            padding-top: 15px;
            border-radius: 20px;
        }

        .contact-inputs:focus {
            border: 2px solid #ff994f;
        }

        .contact-inputs::placeholder {
            color: #a9a9a9;
        }

        .contact-left button {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            font-size: 16px;
            color: #FFFFFF;
            gap: 10px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(270deg, #ff644f, #fae26d);
            cursor: pointer;
        }

        .contact-left button img {
            height: 15px;
        }

        .contact-right img {
            width: 500px;
        }

        @media(max-width:800px) {
            .contact-inputs {
                width: 80vw;
            }

            .contact-right {
                display: none;
            }
        }
    </style>
</head>

<body>



    <section class="header">

        <nav>

            <a href="index.html"><img src="images/ams-logo.png"></a>


            <div class="nav-links" id="navLinks">

                <i class="fa fa-times" onclick="hideMenue()"></i>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="com.html">Committee</a></li>
                    <li><a
                            href="https://script.google.com/macros/s/AKfycbxge8xEALvS-daR7Cv8XDSQARitSBE745TH64eXUcYCw85oiwrl2FPR4MMj6VIc2bWclA/exec">Membership</a>
                    </li>
                    <li><a href="" class="active">Contact</a></li>
                </ul>

            </div>

            <i class="fa fa-bars" onclick="showMenue()"></i>

        </nav>

        <div class="contact-container">

            <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">

                <div class="contact-left-title">
                    <h2>Contact Us</h2>
                    <hr>
                </div>
                <input type="hidden" name="access_key" value="6b4f90b3-d887-4b97-b975-876969886bd3">
                <input type="text" name="name" placeholder="Your Name" class="contact-inputs" required>
                <input type="email" name="email" placeholder="Your E-mail" class="contact-inputs" required>
                <textarea name="message" placeholder="Your Message" class="contact-inputs" required></textarea>
                <button type="submit">Submit <img src="images/assets/arrow_icon.png" alt=""></button>

            </form>

            <div class="contact-right">
                <img src="images/assets/right_img.png">
            </div>
        </div>


    </section>


    <!-- -------JavaScript for Toggle Menue------ -->

    <script>

        var navLinks = document.getElementById("navLinks");

        function showMenue() {
            navLinks.style.right = "0";
        }

        function hideMenue() {
            navLinks.style.right = "-200px";
        }


    </script>

    <!--aos-->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            easing: "ease-in-out",
            once: true
        });
    </script>


</body>

</html>
